version: '3.8'

networks:
  fraud-net:
    driver: bridge

services:
  nemo:
    build: .
    container_name: nemo-24.09
    networks:
      - fraud-net
    ports:
      - "8889:8889"  
    volumes:
      - /data:/data
    tty: true
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nemo-automodel:
    image: nvcr.io/nvidia/nemo-automodel:26.06.00
    container_name: nemo-fraud-detection-nemo-automodel-1
    networks:
      - fraud-net
    command: jupyter notebook --ip=0.0.0.0 --port=8887 --no-browser --allow-root
    ports:
      - "8887:8887"
    working_dir: /data
    shm_size: "8g"
    volumes:
      - /data:/data
      - ./hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nim-llama3:
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:latest
    container_name: nim-llama3
    user: "root"
    networks:
      - fraud-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - /opt/dlami/nvme/nim-cache:/opt/nim/.cache
    ports:
      - "8800:8000"
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: dcgm-exporter
    user: "0:0"         
    cap_add:
      - SYS_ADMIN
    networks:
      - fraud-net
    ports:
      - "9400:9400"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - fraud-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - fraud-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data: